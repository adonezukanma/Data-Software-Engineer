<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NETFLIX Demo</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-left">
    <div class="logo">NETFLIX</div>
    <nav class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">New &amp; Popular</a>
      <a href="#">My List</a>
    </nav>
  </div>
  <div class="nav-right">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Titles, genres..." />
    </div>
    <div class="profile-avatar">DE</div>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 id="hero-title">Loading…</h1>
      <p id="hero-description" class="hero-description"></p>
      <div class="hero-buttons">
        <button class="btn btn-play" id="hero-play">&#9654; Play</button>
        <button class="btn btn-info" id="hero-info">ⓘ More Info</button>
      </div>
    </div>
  </section>

  <div id="rows"></div>

  <div id="search-results" class="row search-results hidden">
    <h2 class="row-title">Search Results</h2>
    <div class="row-track" id="search-track"></div>
    <p id="no-results" class="no-results hidden">No matches found.</p>
  </div>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-backdrop-img" id="modal-backdrop-img"></div>
    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <div class="modal-meta">
        <span class="rating-badge" id="modal-rating"></span>
        <span id="modal-year"></span>
        <span id="modal-duration"></span>
        <span class="maturity-badge" id="modal-maturity"></span>
      </div>
      <p id="modal-description"></p>
      <span class="genre-tag" id="modal-genre"></span>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>This is a fictional demo UI built for portfolio purposes. Not affiliated with Netflix. All titles, posters and
     descriptions are placeholder sample data.</p>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
